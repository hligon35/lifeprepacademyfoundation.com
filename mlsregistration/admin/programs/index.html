<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Programs Dashboard | LifePrep Academy Foundation</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="/admin/admin.css?v=2026-09-16-1" />
  </head>
  <body class="admin-body">
    <header class="admin-topbar">
      <a class="admin-brand" href="/admin"><img src="https://www.lifeprepacademyfoundation.com/logo.png" alt="" width="48" height="48" /><span>Programs Dashboard</span></a>
      <div class="admin-account"><span id="admin-status" class="status-pill status-pill--loading">Checking access</span><button id="logout-button" class="button button--quiet" type="button">Log out</button></div>
    </header>
    <main class="programs-main">
      <div class="programs-wrap">
        <p class="eyebrow">LifePrep Academy Foundation</p>
        <h1>Choose a program</h1>
        <p class="program-note">Open a program dashboard to manage its registrations, people, and operations.</p>
        <div class="program-grid" aria-label="Available program dashboards">
          <a class="program-card program-card--pgs program-card--wide" href="https://pgs.lifeprepacademyfoundation.com/">
            <img src="https://mlsregistration.lifeprepacademyfoundation.com/LPAFxPGS.PNG" alt="Paducah GO Soccer logo" />
            <h2>Paducah GO Soccer League</h2>
          </a>
          <a class="program-card program-card--pnffl" href="https://pgs.lifeprepacademyfoundation.com/?program=pnffl" aria-label="Paducah NFL Flag Football League">
            <img src="https://www.lifeprepacademyfoundation.com/NFLFlagBlue.png" alt="Paducah NFL Flag Football League logo" />
            <h2>Paducah NFL Flag Football League</h2>
          </a>
          <a class="program-card program-card--pnffc" href="https://pgs.lifeprepacademyfoundation.com/?program=pnffc" aria-label="Paducah NFL Flag Football Clinic">
            <img src="https://www.lifeprepacademyfoundation.com/NFLFlagWhite.png" alt="Paducah NFL Flag Football Clinic logo" />
            <h2>Paducah NFL Flag Football Clinic</h2>
          </a>
        </div>
      </div>
    </main>
    <script src="/admin/programs/programs.js?v=2026-09-16-1" defer></script>
  </body>
</html>
